<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header><h1>📸 Infinite Gallery</h1><p>Scroll down to load more</p></header>
    <main>
      <div class="gallery" id="gallery"></div>
      <div class="spinner" id="spinner"><div class="spinner__ring"></div></div>
      <div class="sentinel" id="sentinel"></div>
    </main>
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
      <button class="lightbox__close" id="lightboxClose" aria-label="Close">✕</button>
      <img class="lightbox__img" id="lightboxImg" src="" alt="" />
      <p class="lightbox__caption" id="lightboxCaption"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
