<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Infinite Gallery</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#f0f0f0;min-height:100vh}
header{text-align:center;padding:2.5rem 1rem 1.5rem}
header h1{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:700}
header p{margin-top:.4rem;color:#888;font-size:.95rem}
.gallery{columns:2 280px;gap:12px;padding:1rem 1.5rem;max-width:1400px;margin:0 auto}
.gallery__item{break-inside:avoid;margin-bottom:12px;border-radius:10px;overflow:hidden;background:#1a1a1a;cursor:pointer;position:relative}
.gallery__item:hover img{transform:scale(1.04)}
.gallery__item img{width:100%;display:block;opacity:0;transition:opacity .4s,transform .3s}
.gallery__item img.loaded{opacity:1}
.gallery__item:hover .ov{opacity:1}
.ov{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.7));opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:.75rem}
.ov p{font-size:.8rem;color:#ddd}
.spinner{display:flex;justify-content:center;padding:2rem;visibility:hidden}
.spinner.on{visibility:visible}
.ring{width:40px;height:40px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sentinel{height:1px}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:80vh;border-radius:8px;object-fit:contain}
.lb p{color:#aaa;font-size:.85rem}
.lbc{position:absolute;top:1rem;right:1.5rem;background:none;border:none;color:#fff;font-size:1.8rem;cursor:pointer}
</style></head>
<body>
<header><h1>📸 Infinite Gallery</h1><p>Scroll to load more</p></header>
<main>
  <div class="gallery" id="gallery"></div>
  <div class="spinner" id="spinner"><div class="ring"></div></div>
  <div class="sentinel" id="sentinel"></div>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="lbc" id="lbc" aria-label="Close">✕</button>
  <img id="lbImg" src="" alt=""/>
  <p id="lbCap"></p>
</div>
<script>
const KEY="YOUR_ACCESS_KEY",PER=12,API="https://api.unsplash.com/photos";
let page=1,fetching=false;
const gallery=document.getElementById("gallery"),spinner=document.getElementById("spinner"),lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg"),lbCap=document.getElementById("lbCap");

async function load(){
  if(fetching)return;fetching=true;spinner.classList.add("on");
  try{
    const u=new URL(API);u.searchParams.set("page",page);u.searchParams.set("per_page",PER);u.searchParams.set("client_id",KEY);
    const r=await fetch(u);if(!r.ok)throw new Error("API error");
    (await r.json()).forEach(p=>{
      const d=document.createElement("div");d.className="gallery__item";
      d.innerHTML=`<img src="${p.urls.regular}" alt="${p.alt_description||""}" loading="lazy"/><div class="ov"><p>📷 ${p.user.name}</p></div>`;
      d.querySelector("img").addEventListener("load",e=>e.target.classList.add("loaded"));
      d.addEventListener("click",()=>{lbImg.src=p.urls.full;lbCap.textContent=`📷 ${p.user.name}`;lb.classList.add("open");document.body.style.overflow="hidden";});
      gallery.appendChild(d);
    });
    page++;
  }catch(e){gallery.insertAdjacentHTML("beforeend",`<p style="color:#f66;padding:1rem;column-span:all">Failed. Check API key.</p>`);}
  finally{spinner.classList.remove("on");fetching=false;}
}

function close(){lb.classList.remove("open");lbImg.src="";document.body.style.overflow="";}
document.getElementById("lbc").addEventListener("click",close);
lb.addEventListener("click",e=>{if(e.target===lb)close();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
new IntersectionObserver(e=>{if(e[0].isIntersecting)load();},{rootMargin:"200px"}).observe(document.getElementById("sentinel"));
load();
</script>
</body></html>
