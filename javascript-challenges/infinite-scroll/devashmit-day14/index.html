<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Infinite Gallery</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#f0f0f0;min-height:100vh}
header{text-align:center;padding:2.5rem 1rem 1.5rem}
header h1{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:700}
header p{margin-top:.4rem;color:#888;font-size:.95rem}
.gallery{columns:2 280px;gap:12px;padding:1rem 1.5rem;max-width:1400px;margin:0 auto}
.gallery__item{break-inside:avoid;margin-bottom:12px;border-radius:10px;overflow:hidden;background:#1a1a1a;cursor:pointer;position:relative}
.gallery__item:hover img{transform:scale(1.04)}
.gallery__item img{width:100%;display:block;opacity:0;transition:opacity .4s,transform .3s}
.gallery__item img.loaded{opacity:1}
.gallery__item:hover .gallery__overlay{opacity:1}
.gallery__overlay{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.7));opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:.75rem}
.gallery__overlay p{font-size:.8rem;color:#ddd}
.spinner{display:flex;justify-content:center;padding:2rem;visibility:hidden}
.spinner.visible{visibility:visible}
.spinner__ring{width:40px;height:40px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sentinel{height:1px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:80vh;border-radius:8px;object-fit:contain}
.lightbox p{color:#aaa;font-size:.85rem}
.lightbox__close{position:absolute;top:1rem;right:1.5rem;background:none;border:none;color:#fff;font-size:1.8rem;cursor:pointer}
</style></head>
<body>
<header><h1>📸 Infinite Gallery</h1><p>Scroll down to load more</p></header>
<main>
  <div class="gallery" id="gallery"></div>
  <div class="spinner" id="spinner"><div class="spinner__ring"></div></div>
  <div class="sentinel" id="sentinel"></div>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox__close" id="lbClose" aria-label="Close">✕</button>
  <img id="lbImg" src="" alt=""/>
  <p id="lbCaption"></p>
</div>
<script>
const CONFIG={accessKey:"YOUR_ACCESS_KEY",perPage:12};
const API="https://api.unsplash.com/photos";
let page=1,fetching=false;

const gallery=document.getElementById("gallery");
const spinner=document.getElementById("spinner");
const lbClose=document.getElementById("lbClose");
const lightbox=document.getElementById("lightbox");
const lbImg=document.getElementById("lbImg");
const lbCaption=document.getElementById("lbCaption");

async function loadPhotos(){
  if(fetching)return;fetching=true;spinner.classList.add("visible");
  try{
    const url=new URL(API);url.searchParams.set("page",page);url.searchParams.set("per_page",CONFIG.perPage);url.searchParams.set("client_id",CONFIG.accessKey);
    const r=await fetch(url);if(!r.ok)throw new Error("API error");
    const photos=await r.json();
    photos.forEach(p=>{
      const item=document.createElement("div");item.className="gallery__item";
      item.innerHTML=`<img src="${p.urls.regular}" alt="${p.alt_description||"Photo"}" loading="lazy"/><div class="gallery__overlay"><p>📷 ${p.user.name}</p></div>`;
      item.querySelector("img").addEventListener("load",e=>e.target.classList.add("loaded"));
      item.addEventListener("click",()=>{lbImg.src=p.urls.full;lbImg.alt=p.alt_description||"";lbCaption.textContent=`📷 ${p.user.name}`;lightbox.classList.add("open");document.body.style.overflow="hidden";});
      gallery.appendChild(item);
    });
    page++;
  }catch(e){gallery.insertAdjacentHTML("beforeend",`<p style="color:#f66;padding:1rem;column-span:all">Failed. Check your API key.</p>`);}
  finally{spinner.classList.remove("visible");fetching=false;}
}

function closeLb(){lightbox.classList.remove("open");lbImg.src="";document.body.style.overflow="";}
lbClose.addEventListener("click",closeLb);
lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLb();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();});

new IntersectionObserver(entries=>{if(entries[0].isIntersecting)loadPhotos();},{rootMargin:"200px"}).observe(document.getElementById("sentinel"));
loadPhotos();
</script>
</body></html>
